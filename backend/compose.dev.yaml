# Use postgres/example user/password credentials
version: '3.9'

services:
  db:
    image: postgres:17.2-alpine3.21
    restart: always
    # set shared memory limit when using docker-compose
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: supersecret
    ports:
      - "5432:5432"

  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"